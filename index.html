<body>
<section class="game-menu" id="gameMenu" aria-label="Level selection">
  <div class="menu-card">
    <h1>Level ekak thoranna</h1>
    <p>Level eka dinuwama ilanga eka unlock wenawa.</p>
    <div class="level-grid" id="levelGrid"></div>
  </div>
</section>
<main>
  <section class="game-stage" aria-label="Snakes and ladders board">
    <div class="status-row"><div><div class="status" id="status">Dan 1 kotuwe</div><div class="rolls" id="levelLabel">Level 1</div></div><div class="rolls">Ravum: <span id="rollCount">0</span></div></div>
    <div class="board-perspective">
      <div class="board-shell">
        <div class="board" id="board"></div>
        <svg class="routes" id="routes" viewBox="0 0 1000 1000" aria-hidden="true"></svg>
        <div class="token" id="token" aria-label="Your playing piece"></div>
        <div class="board-fx" id="boardFx" aria-hidden="true"></div>
      </div>
    </div>
  </section>
  <aside class="console">
    <p class="message" id="message" role="status" aria-live="polite">Ravuma touch karala game eka patan ganna!</p>
    <div class="spinner-wrap">
      <div class="pointer" aria-hidden="true"></div>
      <button class="spinner" id="spinButton" aria-label="Spin the number wheel">
        <span class="spinner-face" id="spinnerFace" aria-hidden="true">
          <span class="num" style="--a:0deg">1</span><span class="num" style="--a:60deg">2</span><span class="num" style="--a:120deg">3</span><span class="num" style="--a:180deg">4</span><span class="num" style="--a:240deg">5</span><span class="num" style="--a:300deg">6</span>
        </span>
        <span class="hub">TOUCH</span>
      </button>
    </div>
    <div class="console-actions">
      <button class="restart" id="restart">Aye patan ganna</button>
      <button class="menu-button" id="menuButton" type="button">Levels</button>
      <button class="sound-toggle" id="soundToggle" type="button" aria-pressed="true">Sound ON</button>
      <button class="next-button" id="nextButton" type="button">Ilanga level eka</button>
    </div>
    <div class="legend">
      <div><span class="swatch"></span>Inimaga — ikmanin udata</div>
      <div><span class="swatch snake"></span>Naya — aye pahalata</div>
    </div>
  </aside>
</main>
<div class="confetti" id="confetti" aria-hidden="true"></div>

    var steps=Math.max(3,Math.floor(len/62));for(var j=1;j<steps;j++){var t=j/steps,x=p1.x+dx*t,y=p1.y+dy*t;g.appendChild(svg('line',{x1:x+nx,y1:y+ny+3,x2:x-nx,y2:y-ny+3,stroke:'#7b5b0e','stroke-width':'15','stroke-linecap':'round'}));g.appendChild(svg('line',{x1:x+nx,y1:y+ny,x2:x-nx,y2:y-ny,stroke:'#ffe16a','stroke-width':'10','stroke-linecap':'round'}))}routes.appendChild(g)}
  function drawSnake(a,b,idx){var head=point(a),tail=point(b),dx=tail.x-head.x,dy=tail.y-head.y;var bend=(idx%2?1:-1)*95;var d='M '+head.x+' '+head.y+' C '+(head.x+bend)+' '+(head.y+dy*.28)+', '+(tail.x-bend)+' '+(head.y+dy*.72)+', '+tail.x+' '+tail.y;
    var g=svg('g',{});g.appendChild(svg('path',{d:d,fill:'none',stroke:'rgba(52,22,13,.38)','stroke-width':'39','stroke-linecap':'round',transform:'translate(0 7)'}));g.appendChild(svg('path',{d:d,fill:'none',stroke:'#81281d','stroke-width':'33','stroke-linecap':'round'}));g.appendChild(svg('path',{d:d,fill:'none',stroke:idx%2?'#f96b4e':'#ef4b3e','stroke-width':'23','stroke-linecap':'round','stroke-dasharray':'36 11'}));g.appendChild(svg('path',{d:d,fill:'none',stroke:'rgba(255,255,255,.24)','stroke-width':'5','stroke-linecap':'round','stroke-dasharray':'24 23'}));g.appendChild(svg('ellipse',{cx:head.x,cy:head.y,rx:'27',ry:'22',fill:'#f65a43',stroke:'#81281d','stroke-width':'7',transform:'rotate('+(Math.atan2(dy,dx)*180/Math.PI+90)+' '+head.x+' '+head.y+')'}));
    var ang=Math.atan2(dy,dx),px=-Math.sin(ang)*9,py=Math.cos(ang)*9,fx=Math.cos(ang)*9,fy=Math.sin(ang)*9;g.appendChild(svg('circle',{cx:head.x+fx+px,cy:head.y+fy+py,r:'5',fill:'#fff'}));g.appendChild(svg('circle',{cx:head.x+fx-px,cy:head.y+fy-py,r:'5',fill:'#fff'}));g.appendChild(svg('circle',{cx:head.x+fx+px+Math.cos(ang)*2,cy:head.y+fy+py+Math.sin(ang)*2,r:'2.3',fill:'#17271f'}));g.appendChild(svg('circle',{cx:head.x+fx-px+Math.cos(ang)*2,cy:head.y+fy-py+Math.sin(ang)*2,r:'2.3',fill:'#17271f'}));g.appendChild(svg('path',{d:'M '+(head.x+Math.cos(ang)*24)+' '+(head.y+Math.sin(ang)*24)+' l '+(Math.cos(ang)*14)+' '+(Math.sin(ang)*14),stroke:'#ffcfca','stroke-width':'4','stroke-linecap':'round'}));routes.appendChild(g)}
  function redrawRoutes(){routes.innerHTML='';Object.keys(ladders).forEach(function(k){drawLadder(+k,ladders[k])});Object.keys(snakes).forEach(function(k,i){drawSnake(+k,snakes[k],i)})}

  function place(n,klass){var p=point(n);token.style.setProperty('--x',(p.x/10)+'%');token.style.setProperty('--y',(p.y/10)+'%');token.className='token'+(klass?' '+klass:'')}
  function wait(ms){return new Promise(function(resolve){setTimeout(resolve,ms)})}
  function ensureAudio(){try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}catch(e){return null}}
  function tone(freq,dur,type,gain,delay,endFreq){if(!soundOn)return;var ctx=ensureAudio();if(!ctx)return;var at=ctx.currentTime+(delay||0),o=ctx.createOscillator(),g=ctx.createGain();o.type=type||'sine';o.frequency.setValueAtTime(freq,at);if(endFreq)o.frequency.exponentialRampToValueAtTime(endFreq,at+dur/1000);g.gain.setValueAtTime(gain||.05,at);g.gain.exponentialRampToValueAtTime(.001,at+dur/1000);o.connect(g);g.connect(ctx.destination);o.start(at);o.stop(at+dur/1000+.03)}
  function noise(dur,gain,delay){if(!soundOn)return;var ctx=ensureAudio();if(!ctx)return;var len=Math.ceil(ctx.sampleRate*dur/1000),buf=ctx.createBuffer(1,len,ctx.sampleRate),data=buf.getChannelData(0);for(var i=0;i<len;i++)data[i]=(Math.random()*2-1)*(1-i/len);var src=ctx.createBufferSource(),g=ctx.createGain(),at=ctx.currentTime+(delay||0);src.buffer=buf;g.gain.setValueAtTime(gain||.025,at);g.gain.exponentialRampToValueAtTime(.001,at+dur/1000);src.connect(g);g.connect(ctx.destination);src.start(at)}
  function soundStep(n){tone(235+(n%5)*22,85,'sine',.035);tone(118,70,'triangle',.018);noise(45,.012)}
  function soundLadder(){[0,1,2,3,4].forEach(function(i){tone([330,440,523,659,784][i],220,'sine',.045,i*.105)});tone(165,650,'triangle',.022,0,330)}
  function soundSnake(){tone(370,650,'sawtooth',.045,0,78);noise(520,.028);setTimeout(function(){tone(82,300,'square',.025)},420)}
  function soundError(){tone(190,230,'triangle',.045);tone(145,270,'sine',.03,.12)}
  function soundResult(value){tone(610+value*32,180,'triangle',.055);tone(305+value*16,280,'sine',.03,.04)}
  function soundVictory(){[523,659,784,1047].forEach(function(f,i){tone(f,520,'triangle',.05,i*.15)});setTimeout(function(){noise(700,.02)},150)}
  function burst(n,color){var p=point(n);for(var i=0;i<12;i++){var bit=document.createElement('i'),angle=Math.PI*2*i/12,dist=22+Math.random()*36;bit.style.left=(p.x/10)+'%';bit.style.top=(p.y/10)+'%';bit.style.setProperty('--dx',(Math.cos(angle)*dist)+'px');bit.style.setProperty('--dy',(Math.sin(angle)*dist)+'px');bit.style.setProperty('--spark',color||'#ffe16a');boardFx.appendChild(bit);setTimeout(function(el){return function(){el.remove()}}(bit),620)}}
  function boardEffect(name){boardShell.classList.remove('shake','ladder-flash');void boardShell.offsetWidth;boardShell.classList.add(name);setTimeout(function(){boardShell.classList.remove(name)},800)}
  async function moveBy(amount){var target=position+amount;if(target>100){message.textContent='100ට hariyatama enna one — aye try karamu!';soundError();boardEffect('shake');spinning=false;spinButton.disabled=false;return}
    for(var n=position+1;n<=target;n++){position=n;place(position,'jump');status.textContent='Dan '+position+' kotuwe';soundStep(n);await wait(285)}
    if(ladders[position]){var from=position;burst(from,'#ffe16a');position=ladders[position];message.textContent=from+'! Inimaga hambuna — '+position+'ta udata!';place(position,'climb');soundLadder();boardEffect('ladder-flash');await wait(780);burst(position,'#8bf0ac')}
    else if(snakes[position]){var sfrom=position;burst(sfrom,'#ff715f');position=snakes[position];message.textContent=sfrom+'! Naya allagaththa — '+position+'ta pahalata!';place(position,'slide');soundSnake();boardEffect('shake');await wait(680);burst(position,'#ff715f')}
    else if(position<100){message.textContent=position+' kotuwe. Ravuma aye touch karanna.'}
    status.textContent=position===100?'Oba dinuwa!':('Dan '+position+' kotuwe');
    if(position===100){win()}else{spinning=false;spinButton.disabled=false}
  }
  function spin(){if(spinning||position===100)return;ensureAudio();spinning=true;spinButton.disabled=true;rolls++;rollCount.textContent=rolls;var value=Math.floor(Math.random()*6)+1;var turns=5+Math.floor(Math.random()*3);rotation=Math.ceil(rotation/360)*360+turns*360+((360-(value-1)*60)%360);spinnerFace.style.transform='rotate('+rotation+'deg)';message.textContent='Ravuma karakenawa…';noise(120,.025);var tick=0;clearInterval(spinTicks);spinTicks=setInterval(function(){tone(340+(tick%2)*70,38,'square',.018);tick++},115);setTimeout(function(){clearInterval(spinTicks);message.textContent=value+' awa!';soundResult(value);setTimeout(function(){moveBy(value)},430)},2450)}
  function win(){if(currentLevel<10)unlockedLevel=Math.max(unlockedLevel,currentLevel+1);renderMenu();message.textContent=currentLevel<10?('Supiri! Level '+currentLevel+' dinuwa — Level '+(currentLevel+1)+' unlock una!'):('Supiri! Level 10 dinuwa — game eka complete!');token.className='token win';spinButton.disabled=true;nextButton.textContent=currentLevel<10?'Ilanga level eka':'Levels balanna';nextButton.classList.add('show');soundVictory();burst(100,'#ffe16a');var box=document.getElementById('confetti');box.innerHTML='';var colors=['#f55c49','#ffd957','#4eb774','#58acd0'];for(var i=0;i<64;i++){var bit=document.createElement('i');bit.style.setProperty('--l',(Math.random()*100)+'%');bit.style.setProperty('--t',(2.4+Math.random()*2.8)+'s');bit.style.setProperty('--r',(Math.random()*180)+'deg');bit.style.setProperty('--c',colors[i%colors.length]);bit.style.animationDelay=(Math.random()*.8)+'s';box.appendChild(bit)}}
  function reset(){clearInterval(spinTicks);position=1;rolls=0;spinning=false;rotation=0;spinnerFace.classList.add('instant');spinnerFace.style.transform='rotate(0deg)';void spinnerFace.offsetWidth;spinnerFace.classList.remove('instant');rollCount.textContent='0';message.textContent='Ravuma touch karala game eka patan ganna!';status.textContent='Dan 1 kotuwe';spinButton.disabled=false;nextButton.classList.remove('show');token.className='token';place(1);boardFx.innerHTML='';document.getElementById('confetti').innerHTML='';tone(420,110,'sine',.035)}
  function difficultyName(n){if(n<=3)return 'Pahasu';if(n<=6)return 'Meda';if(n<=9)return 'Amaru';return 'Master'}
  function renderMenu(){levelGrid.innerHTML='';for(var i=1;i<=10;i++){var btn=document.createElement('button');btn.type='button';btn.className='level-btn';btn.disabled=i>unlockedLevel;btn.setAttribute('aria-label','Level '+i+(btn.disabled?' locked':''));btn.innerHTML='Level '+i+'<small>'+(btn.disabled?'Locked':difficultyName(i))+'</small>';if(!btn.disabled){btn.dataset.level=i;btn.addEventListener('click',function(){startLevel(+this.dataset.level)})}levelGrid.appendChild(btn)}}
  function startLevel(n){if(n>unlockedLevel)return;currentLevel=n;ladders=levels[n-1].l;snakes=levels[n-1].s;levelLabel.textContent='Level '+n;redrawRoutes();reset();document.body.classList.add('playing');tone(460+n*18,180,'triangle',.04)}
  function showMenu(){if(spinning)return;document.body.classList.remove('playing');renderMenu()}
  function toggleSound(){soundOn=!soundOn;soundToggle.setAttribute('aria-pressed',String(soundOn));soundToggle.textContent=soundOn?'Sound ON':'Sound OFF';if(soundOn){ensureAudio();tone(540,120,'sine',.04)}else{clearInterval(spinTicks)}}
  spinButton.addEventListener('click',spin);restart.addEventListener('click',reset);soundToggle.addEventListener('click',toggleSound);menuButton.addEventListener('click',showMenu);nextButton.addEventListener('click',function(){if(currentLevel<10)startLevel(currentLevel+1);else showMenu()});renderMenu();place(1);
})();
